const customerFallback = new Map();
function fallbackKey(customer, factory, group) {
  return JSON.stringify([customer, factory, group]);

function readFallback(customer, factory, group) {
  const key = fallbackKey(customer, factory, group);
  return allowCustom({cust:customer,fac:factory}) && customerFallback.has(key)
    ? customerFallback.get(key) : FALLBACK[factory]?.[group]||[];
}
function platformCandidates(platform,rows,virtual){
  const sources=platform==='禾量'?HL_SOURCES:[platform];
  const normal=sources.flatMap(source=>rows(source).filter(item=>item.on&&!item.virtual&&(platform!=='禾量'||item.hl)).sort((a,b)=>a.sort-b.sort));
  if(!virtual?.on)return normal;
  const at=normal.findIndex(item=>virtual.sort<item.sort);
  return at<0?[...normal,virtual]:[...normal.slice(0,at),virtual,...normal.slice(at)];
}
function orderFallback(customer,factory,platform){
  const rows=source=>readFallback(customer,factory,source).map((item,index)=>({...item,source,hl:(HL_AUTH[factory]?.[source]||[]).includes(item.cp),sort:index+1}));
  const virtual=readFallback(customer,factory,'其他平台').find(item=>item.virtual);
  return platformCandidates(platform,rows,virtual&&{...virtual,source:'其他平台'});
}
function updateFallback(factory, group, update) {
  const merchant = S.role === 'shop';
  if (merchant && !allowCustom({cust:ME,fac:factory})) return;
  const key = fallbackKey(ME,factory,group);
  const prior = merchant ? customerFallback.get(key) : FALLBACK[factory][group];
  const items = structuredClone(prior || FALLBACK[factory][group]);
  update(items);
  if (merchant) customerFallback.set(key,items);
  else FALLBACK[factory][group]=items;
  showUndo('兜底顺序已调整',()=>{
    if (!merchant) FALLBACK[factory][group]=prior;
    else if (prior) customerFallback.set(key,prior);
    else customerFallback.delete(key);
  });
  render();
}

/* ============ 匹配引擎（示意，对应 PRD §5） ============ */
function grpKey(r){return r.o+'|'+r.sc+'|'+(r.kind||'normal')+'|'+(r.sub||'')}
function avail(cp,o){
  if(!(FACTORY_CP[o.fac]||[]).includes(cp)) return `${o.fac}未开通「${cp}」`;
  if((DISABLED[o.fac]||[]).includes(cp)) return `商家已禁止${o.fac}使用「${cp}」`;
  const ca=(CONTROL[o.fac]||{})[cp]; if(ca&&ca.includes(o.prov)) return `${o.prov}在「${cp}」的管控区域内`;
  return '';
}
function protectedReason(o,untakenY=false) {
  if (o.src==='platform') return '平台指定，须沿用平台物流';
  if (o.addressNotice && (o.request==='unknown'||untakenY)) return '地址已变，旧面单及改址取号请求待核';
  if (o.quotaReview && o.request==='unknown') return '共享面单扣额失败，原取号结果待核；补足额度后仍需核对';
  if (o.request==='unknown') return '原预约已提交，结果未知，先核对原请求';
  if (o.request==='pending') return '原预约处理中，等待回执';
  if (o.request==='cancelPending'||o.request==='cancelUnknown')return '原预约的取消结果待核，先核对原请求';
  if (o.src==='legacy') return '原物流来源未查明，先核对历史';
  if (o.partialWaybill){
    if(!untakenY)return '主单关联子单 X 的运单；按子单核对可办动作';
    const [x,y]=o.lines;
    if(y.source==='platform'||y.source==='平台指定')return 'Y 为平台指定，保留原物流';
    if(!x.waybill||o.waybill!==x.waybill||x.cp!==x.shopCp||x.cp!==x.factoryCp||x.cp!==x.factoryBarcodeCp||x.cp!==x.auditCp)
      return 'X 的快递、原运单与子单归属需先核对';
  }
  if (o.st==='已取号'||(o.waybill&&!untakenY)) return '已有运单，保留原物流';
  return '';
}
const FIELD={region:'prov',platform:'pf',shop:'shop',factory:'fac',customer:'cust',otype:'otype',model:'model',material:'mat',dept:'operatorDept',qty:'qty',weight:'weight',amount:'amount'};
function matchConds(c,o,kind='normal'){
  const missing=[];
  for(const k in c){
    const v=c[k],f=FIELD[k],n=condName(k);
    if(!f) return {ok:false,why:`条件「${n}」不适用于国内订单`};
    const val=o[f];
    if(k==='material'&&kind!=='branch'){
      const items=o.materials||[val], found=items.filter(x=>x&&v.v.includes(x));
      if(found.length&&v.op==='nin')return {ok:false,why:'订单含有排除材质：'+found.join('、')};
      if(!found.length){
        if(!items.length||items.some(x=>!x)){missing.push(n);continue}
        if(v.op!=='nin')return {ok:false,why:'整单商品均未包含所选材质：'+v.v.join('、')};
      }
      continue;
    }
    if(k!=='dept' && (val==null || val==='')){
      missing.push(n);
      continue;
    }
    if(k==='region'){const paths=[o.prov,o.prov+'/'+o.city,o.prov+'/'+o.city+'/'+o.dist];const inS=v.v.some(x=>paths.includes(x));const ok=v.op==='nin'?!inS:inS;
      if(!ok) return {ok:false,why:`收货地区：${paths[2]} ${v.op==='nin'?'在排除范围内':'不属于 '+v.v.slice(0,3).join('、')+(v.v.length>3?' 等':'')}`};continue}
    if(v.v){const inS=v.v.includes(val);const ok=v.op==='nin'?!inS:inS;
      if(!ok) return {ok:false,why:`${n}：${val||'空'} ${v.op==='nin'?'在排除范围内':'不属于 '+v.v.slice(0,3).join('、')+(v.v.length>3?' 等':'')}`};}
    else if(v.min!==undefined){
      const x=Number(val);
      if(!Number.isFinite(x)){missing.push(n);continue}
      const hasMin=v.min!=null && v.min!=='', hasMax=v.max!=null && v.max!=='';
      if((hasMin&&x<Number(v.min))||(hasMax&&x>=Number(v.max))) return {ok:false,why:`${n}：${x} 不在 ${hasMin?v.min:'-∞'} ~ ${hasMax?v.max:'+∞'} 内`};
    }
  }
  if(missing.length)return {ok:false,missing:true,why:`缺少${missing.join('、')}，无法核对本条规则`};
  const ks=Object.keys(c);
  return {ok:true,why:ks.length?ks.map(k=>`${condName(k)}：${k==='region'?o.prov+'/'+o.city+'/'+o.dist:k==='material'&&o.materials?o.materials.join('、'):o[FIELD[k]]} ✔`).join('；'):'无条件（全部订单）'};
}
function enabledRules(owner, draft, kind = 'normal') {
  const inGroup = rule => rule.o === owner && rule.sc === 'domestic' && (rule.kind || 'normal') === kind;
  const list = RULES.filter(inGroup);
  if (draft && inGroup(draft)) {
    const underReview = {...draft, _draft: 1};
    const index = list.findIndex(rule => rule.id === draft.id);
    if (index >= 0) list[index] = underReview;
    else if (draft._pos === 'top') list.unshift(underReview);
    else list.push(underReview);
  }
  return list.filter(rule => rule.st);
}
function estimateBranch(order,cp,options={}){
  if(order.fac===MYFAC&&EXEC.branch){
    const context={...order,operatorDept:options.operatorDept||''};
    for(const rule of enabledRules('factory',options.extra,'branch')){
      if(rule.a.cp!==cp)continue;
      const match=matchConds(rule.c,context,'branch');
      if(match.missing)return {branch:'',pending:match.why};
      if(match.ok)return {branch:rule.a.branch,reason:'命中网点规则「'+rule.name+'」'};
    }
  }
  return {branch:cp+'-'+order.fac+'网点',reason:order.fac===MYFAC&&!EXEC.branch?'工厂未启用网点规则，按网点顺序选择':'未命中网点规则，按网点顺序选择'};
}
function runEngine(o,opt){
  opt=opt||{};const steps=[];const add=(cls,tt,td)=>steps.push({cls,tt,td:td||''});
  const res={cp:'',branch:'',sup:'',src:'none',rule:'',reason:'',unavailableRules:[]};
  if(protectedReason(o)){
    (o.hist||[]).forEach(h=>add(h[0],h[1],h[2]));
    add('warn',protectedReason(o),'保留来源和已有结果');
    return {steps,res:Object.assign(res,{cp:o.cp,src:o.src,rule:o.rule,branch:o.branch,keep:1})};
  }
  if(o.lock&&(!opt.unlock||o.src==='platform')){
    add('warn',`物流来源为「${SRC[o.src][0]}」，已锁定，规则不覆盖`,o.op?`${o.op} 手动设置为 ${o.cp}`:(o.src==='platform'?'平台指定物流，规则不参与（解除锁定也不参与）':`导入时携带快递 ${o.cp}`));
    return {steps,res:Object.assign(res,{cp:o.cp,src:o.src,keep:1})};
  }
  if(!o.prov){res.incomplete=true;res.reason='收货地址无法识别，请补齐收货地区';add('warn','收货地址待核',res.reason);return {steps,res}}
  if(!o.fac&&o.firstFactoryCase){

    const region=o.prov==='广东省';
    res.cp=region?'韵达':o.firstFactoryCase.storeVirtual?'店铺虚拟快递 V':'';
    res.src=region?'areaBeforeFactory':res.cp?'fallback':'none';
    res.reason=region?'广东地区优先配置命中':res.cp?'地区未命中，取本店其他平台虚拟快递':'地区未命中，本店没有其他平台虚拟快递';
    add(res.cp?'ok':'warn',res.reason,'无工厂时不读取任何工厂的兜底顺序。主单和子单均未分配工厂。');
    add('fin',res.cp?'普通快递：'+res.cp:'普通快递留空','本例无运单号、无超级快递，尚未推厂。');
    return {steps,res};
  }
  const warns=[];
  const tryRules=(list,label,src)=>{
    for(let i=0;i<list.length;i++){
      const r=list[i];const m=matchConds(r.c,o);
      if(r.preexistingOrders?.includes(o.no)){add('no',`「${r.name}」仅对确认后新订单生效`,'此订单在该规则启用前已存在');continue}
      if(src==='factory'&&r.c.customer&&m.ok)m.why=m.why.split('；').filter(t=>!t.startsWith('客户（商家）')).join('；')||'适用于该订单';
      const nm=`${label}「${r.name}」${r._draft?'（编辑中）':''}`;
      if(m.missing){add('warn',nm+' 待核对',m.why);return {incomplete:true,why:m.why}}
      if(!m.ok){if(src==='factory'&&r.c.customer&&!matchConds({customer:r.c.customer},o).ok)continue;/* 商家视角不展示只对其他客户生效的工厂规则 */add('no',nm+' 未命中',m.why);continue}
      if(r.a.t==='none'){add('warn',nm+' 命中：动作为“不分配”',m.why);return {none:1,r}}
      const cands=r.a.t==='fixed'?[r.a.cp]:r.a.list;const bad=[];
      for(const cp of cands){const why=avail(cp,o);if(!why){add('ok',`${nm} 命中 → ${cp}`,m.why+(bad.length?'；已跳过：'+bad.join('；'):''));return {cp,r,src}}bad.push(why)}
      add('warn',`${nm} 命中，但物流不可用，继续往下匹配`,bad.join('；'));warns.push(`「${r.name}」命中但${bad.join('、')}`);
      res.unavailableRules.push(r.id);
    }
    return null;
  };
  let hit=null;
  const shopRules = o.cust === ME ? enabledRules('shop',opt.extra) : [];
  if (shopRules.length) hit=tryRules(shopRules,'商家规则','rule');
  else add('no','商家规则：没有启用的规则');
  if(!hit){
    if(o.fac!==MYFAC) add('no',`工厂默认规则：${o.fac} 未配置`);
    else{const l=enabledRules('factory',opt.extra);if(!l.length)add('no','工厂默认规则：没有启用的规则');else hit=tryRules(l,'工厂默认规则','factory')}
  }
  if(hit?.incomplete){res.incomplete=true;res.reason=hit.why;return {steps,res}}
  if(!hit){
    const fb=orderFallback(o.cust,o.fac,o.pf);const bad=[];
    for(const x of fb){const why=x.virtual?'':avail(x.cp,o);if(!why){add('ok',`兜底顺序（${o.pf}，${x.source}，${allowCustom(o)&&customerFallback.has(fallbackKey(o.cust,o.fac,x.source))?'商家顺序':'工厂顺序'}）→ ${x.cp}`,bad.length?'已跳过：'+bad.join('；'):'取第一个可用的快递');hit={cp:x.cp,virtual:x.virtual,src:'fallback',r:{name:'兜底顺序'}};break}bad.push(why)}
    if(!hit){add('warn','兜底顺序：没有可用的快递',bad.join('；')||'未开启任何快递');res.reason=warns.concat(['兜底顺序中：'+(bad.join('；')||'未开启任何快递')]).join('；');return {steps,res}}
  }
  res.rule=hit.r.name;
  if(hit.r.id){res.ruleId=hit.r.id;res.ruleVersion='v'+ver(hit.r)}
  if(hit.none){res.reason=`命中「${res.rule}」，动作为“不分配”，需人工设置快递`;return {steps,res}}
  res.cp=hit.cp;res.src=hit.src;
  if(hit.virtual){
    res.branch='虚拟网点（仅占位）';
    add('warn','虚拟快递不支持预约面单','本厂直接取号会停止。他厂代发需核对目标工厂的映射和真实网点。');
    res.sup=selectSuper(o,opt,add);
    return {steps,res};
  }
  const estimate=estimateBranch(o,hit.cp,opt);
  res.branch=estimate.branch;res.branchPending=estimate.pending||'';
  if(res.branchPending)add('warn','预计网点待核对',res.branchPending);
  else add('fin',`预计网点：${res.branch}`,estimate.reason);
  res.sup=selectSuper(o,opt,add);
  return {steps,res};
}
function addEvt(o,txt,at){(o.events=o.events||[]).push({t:at||nowStr(),txt})}
function syncUnbookedLines(order){
  for(const line of order.lines||[]){
    if(!line.waybill){line.fac=order.fac;line.cp=order.cp}
  }
}
function matchOnEntry(order,options){
  if(order.fac!==MYFAC||EXEC.auto||protectedReason(order)||order.lock)return applyEngine(order,options);
  const time=options.time||nowStr();
  const reason='本厂已关闭订单入库后自动匹配，可手动重新匹配物流';
  Object.assign(order,{cp:'',src:'none',rule:'',branch:'',sup:'',lock:0,reason,trace:[{cls:'warn',tt:'入库时跳过自动匹配',td:reason}],traceAt:time});
  addEvt(order,'入库时跳过自动匹配：'+reason,time);
  return false;
}
function sameSelection(a,b){
  return ['cp','src','ruleId','ruleVersion','sup','branch','branchPending','reason'].every(key=>(a[key]||'')===(b[key]||''));
}
function applyEngine(o,opt){
  const prior=o.cp||'未匹配';const priorSuper=o.sup||'无';const {steps,res}=runEngine(o,opt);if(res.keep) return false;
  const at=opt?.time||nowStr();
  if(!opt?.seeded){
    for(const id of res.unavailableRules){
      const rule=RULES.find(r=>r.id===id);
      if(rule)rule.unav=(rule.unav||0)+1;
    }
  }
  if(res.incomplete){
    o.matchPending=res.reason;
    if(!o.src){o.src='none';o.cp=''}
    if(o.src==='none')o.reason=res.reason;
    addEvt(o,(opt?.why||'自动匹配')+' · 资料待核：'+res.reason+'；保留'+prior,at);
    return false;
  }
  o.matchPending='';o.branchPending=res.branchPending||'';
  Object.assign(o,{cp:res.cp,branch:res.branch,sup:res.sup,src:res.src,rule:res.rule,ruleId:res.ruleId,ruleVersion:res.ruleVersion,reason:res.reason,lock:0,op:'',trace:steps,traceAt:at});
  if(o.lines){syncUnbookedLines(o);o.lastFirstFactory=false}
  if(o.ruleId)rememberHit(o,at,!opt?.seeded);
  const explanation=res.src==='none'?res.reason:SRC[res.src][0]+(res.rule&&res.src!=='fallback'?'「'+res.rule+'」':'');
  addEvt(o,`${(opt&&opt.why)||'自动匹配'}：${prior} → ${res.cp||'未匹配'}（${explanation}）${priorSuper!==(res.sup||'无')?'；超级快递 '+priorSuper+' → '+(res.sup||'无'):''}`,at);return true;
}
function traceHtml(steps){return `<div class="trace">${steps.map(s=>`<div class="ti ${s.cls||'no'}"><div class="tt">${esc(s.tt)}</div>${s.td?`<div class="td">${esc(s.td)}</div>`:''}</div>`).join('')}</div>`}
function visibleOrders(){
  return ORDERS.filter(o=>S.role==='shop'?o.cust===ME:
    o.fac===MYFAC&&o.factoryReceived&&!o.awaitingPush&&!['待整理','待推送','已反审'].includes(o.st));
}
function rememberHit(order,at,updateCounts=false){
  if(updateCounts){
    const rule=RULES.find(r=>r.id===order.ruleId);
    if(rule){
      if(!recentRuleHit(order,rule.id))rule.hit++;
      rule.last=at;
    }
  }
  const outcome=order.src==='none'?'不分配，转人工处理':'已选 '+order.cp;
  (order.ruleHits??=[]).push({id:order.ruleId,name:order.rule,version:order.ruleVersion,at,outcome});
}
function recentRuleHit(order,id){
  const end=Date.parse(TODAY+'T00:00:00Z'),start=end-6*86400000;
  return order.ruleHits?.some(hit=>{
    const day=Date.parse(hit.at.slice(0,10)+'T00:00:00Z');
    return hit.id===id&&day>=start&&day<=end;
  });
}
function factoryCanReadRule(r) {
  const allowed=r.c.factory;
  return !allowed || (allowed.op==='nin' ? !allowed.v.includes(MYFAC) : allowed.v.includes(MYFAC));
}

    </div><div class="mf"><button class="btn" onclick="closeModal()">关闭</button>${draft?`<button class="btn" id="legacyFullSave" ${draft.needsRefresh||draft.refreshed?'disabled':''}>保存旧版九项整表</button>${draft.needsRefresh?'<button class="btn p" id="legacyRefresh">刷新并保留甲的修改</button>':''}`:''}
    <button class="btn p" id="legacyAction" ${draft?.needsRefresh?'disabled':''}>${draft?'甲仅保存旧页保留项':'甲打开旧配置页'}</button></div>`);
  if(!draft){$('#legacyAction').onclick=()=>{legacySettingsDraft={snapshot:!!EXEC.switchOnFailure,revision:factoryExpressRevision,initial:legacyExpressSettings.other,value:legacyExpressSettings.other};legacySettingsExample()};return}
  $('#legacyOther').value=draft.value;
  $('#legacyOther').onchange=e=>{draft.value=e.target.value};
  $('#legacyDisableSwitch').onclick=()=>{setExecFlag('switchOnFailure',false,'取号失败自动切换快递','员工乙（新页）');render();legacySettingsExample()};
  function saveRetainedField(){
    if(draft.value!==draft.initial&&legacyExpressSettings.other!==draft.value){

      legacyExpressSettings.other=draft.value;

    $('#legacyAction').disabled=true;$('#legacyFullSave').disabled=true;$('#legacyOther').disabled=true;$('#legacyDisableSwitch').disabled=true;
    legacySettingsDraft=null;render();
  }
  $('#legacyAction').onclick=saveRetainedField;
  $('#legacyFullSave').onclick=()=>{
    if(draft.revision===factoryExpressRevision){saveRetainedField();return}
    draft.needsRefresh=true;
    draft.status='工厂快递配置已更新。九项整表未保存，本次零写入。请刷新后保存原想修改的保留项。';
    legacySettingsExample();
  };
  if(draft.needsRefresh)$('#legacyRefresh').onclick=()=>{
    const changed=draft.value!==draft.initial;
    draft.revision=factoryExpressRevision;
    draft.snapshot=!!EXEC.switchOnFailure;
    draft.initial=legacyExpressSettings.other;
    if(!changed)draft.value=draft.initial;
    draft.needsRefresh=false;
    draft.refreshed=true;
    draft.status='已读取最新设置，甲的修改已保留，请仅保存该项。';

function moveRule(id,d){
  const r=RULES.find(x=>x.id===id);const g=RULES.filter(x=>grpKey(x)===grpKey(r));const i=g.indexOf(r),j=i+d;
  if(j<0||j>=g.length){toast(d<0?'已经是第一条':'已经是最后一条');return}
  const a=RULES.indexOf(r),b=RULES.indexOf(g[j]);[RULES[a],RULES[b]]=[RULES[b],RULES[a]];
  recordRuleMove(r,g.map(x=>x.id));render();
}
function recordRuleMove(rule,before){
  const key=grpKey(rule);
  const group=()=>RULES.filter(r=>grpKey(r)===key);
  const after=group().map(r=>r.id);
  const transition=(from,to)=>(from.indexOf(rule.id)+1)+' → '+(to.indexOf(rule.id)+1);
  addLog(rule,'调整优先级',transition(before,after));
  showUndo('「'+rule.name+'」优先级 '+transition(before,after),()=>{
    const current=group(),ids=current.map(r=>r.id),live=current.find(r=>r.id===rule.id);
    if(!live||after.filter(id=>ids.includes(id)).join()!==ids.filter(id=>after.includes(id)).join()){
      return '本组顺序已变化，请刷新后重新排序';
    }
    // 用同组的当前对象恢复原有标识的相对位置。新建的规则保留原位，编辑及删除同样保留。
    const existing=new Map(current.map(r=>[r.id,r]));
    const restored=before.filter(id=>existing.has(id)).map(id=>existing.get(id));
    let index=0;
    RULES=RULES.map(r=>existing.has(r.id)&&before.includes(r.id)?restored[index++]:r);
    addLog(live,'撤销排序',transition(ids,group().map(r=>r.id)));
  });
}

function y2LabelAction(action){

function temuFirstPreview(initialMode,origin=S.role,lanmaSample='pending'){
  const modes=['Temu半托','Temu本土'];

function confirmAeGroup(key,targets,reviewed){
  if(S.role!=='factory'||aeCutover||!Object.hasOwn(aeSources,key))return;
  if(!aeMigrationMayEdit){aeMigrationReview(key,targets,'本厂规则编辑权限已变更，本组继续沿用旧配置。');return}
  const selected={};
  for(const k of Object.keys(aeSources)){
    selected[k]=aeFactoryChannels.find(ch=>ch.code===targets[k]&&ch.available);
    if(!selected[k]){
      aeMigrationReview(key,targets,'对照渠道已失效，本组继续沿用旧配置。请恢复原渠道后刷新，或重选有效渠道并核对三个样本。');return;
    }
  }
  if(reviewed!==aeReviewVersion(targets)){
    aeMigrationReview(key,targets,'渠道状态已变，请重新核对三个样本后再确认。');return;
  }
  const ordered=key==='X'?['X','Y']:['Y','X'];
  const group=RULES.filter(r=>r.o==='factory'&&r.sc==='ae');
  const newRules=ordered.map(k=>{
    const source=aeSources[k];
    const conditions={buyer:{op:'in',v:[AE_BUYER_A]}};
    if(k==='Y')conditions.country={op:'in',v:['US']};
    return {o:'factory',sc:'ae',name:'买家物流 A · '+source.country+' → '+targets[k],st:1,c:conditions,a:{t:'fixed',ch:selected[k].channel},hit:0,last:'—',src:'速卖通渠道规则 '+source.ref,created:TODAY};
  });
  if(group.length+newRules.length>200||newRules.some(r=>group.some(g=>g.name===r.name))){
    toast('规则数量已满或存在同名规则，本组继续沿用旧配置');return;
  }
  const preceding=group.some(r=>r.st&&aeIncludesPendingBuyer(r));
  if(preceding){toast('新入口已有可能匹配买家物流 A 的规则，本组继续沿用旧配置');return}
  const summary=`原记录① X → ${targets.X}，② Y → ${targets.Y}。美国新单优先 ${targets[key]}，德国新单选 ${targets.X}，原单已有 Y 继续沿用。`;
  for(const rule of newRules){
    rule.id=nextId++;RULES.push(rule);
    addLog(rule,'确认迁移',summary);
  }
  aeCutover={choice:key,targets:{...targets},actor:'演示操作员（工厂）',at:nowStr(),summary};
  render();migReport();
}

// 单文件原型离线生成 Excel。各 XML 部件以 ZIP 的存储模式写入，文本单元格不解释公式。
function spreadsheetArchive(files){
  const encoder=new TextEncoder(),local=[],directory=[];
  let offset=0,directorySize=0;
  for(const [path,xml] of Object.entries(files)){
    const name=encoder.encode(path),data=encoder.encode(xml);
    let crc=0xffffffff;
    for(const byte of data){
      crc^=byte;
      for(let bit=0;bit<8;bit++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);
    }
    crc=(crc^0xffffffff)>>>0;
    const header=new DataView(new ArrayBuffer(30));
    header.setUint32(0,0x04034b50,true);
    header.setUint16(4,20,true);
    header.setUint16(12,33,true);
    header.setUint32(14,crc,true);
    header.setUint32(18,data.length,true);
    header.setUint32(22,data.length,true);
    header.setUint16(26,name.length,true);
    local.push(header.buffer,name,data);
    const entry=new DataView(new ArrayBuffer(46));
    entry.setUint32(0,0x02014b50,true);
    entry.setUint16(4,20,true);
    new Uint8Array(entry.buffer,6,26).set(new Uint8Array(header.buffer,4,26));
    entry.setUint32(42,offset,true);
    directory.push(entry.buffer,name);
    offset+=30+name.length+data.length;
    directorySize+=46+name.length;
  }
  const end=new DataView(new ArrayBuffer(22)),count=Object.keys(files).length;
  end.setUint32(0,0x06054b50,true);
  end.setUint16(8,count,true);
  end.setUint16(10,count,true);
  end.setUint32(12,directorySize,true);
  end.setUint32(16,offset,true);
  return new Blob([...local,...directory,end.buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function regionWorkbook(rows){
  const main='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const docs='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const pkg='http://schemas.openxmlformats.org/package/2006';
  const sheetRows=rows.map((row,i)=>{
    const cells=row.map((value,j)=>{
      const cell=String.fromCharCode(65+j)+(i+1);
      const valueXml=esc(String(value).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,''));
      return `<c r="${cell}" t="inlineStr"><is><t xml:space="preserve">${valueXml}</t></is></c>`;
    });
    return `<row r="${i+1}">${cells.join('')}</row>`;
  });
  const cols=[24,28,12,34,32,10,25,48,12].map((width,i)=>`<col min="${i+1}" max="${i+1}" width="${width}" customWidth="1"/>`).join('');
  return spreadsheetArchive({
    '[Content_Types].xml':`<Types xmlns="${pkg}/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`,
    '_rels/.rels':`<Relationships xmlns="${pkg}/relationships"><Relationship Id="rId1" Type="${docs}/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
    'xl/workbook.xml':`<workbook xmlns="${main}" xmlns:r="${docs}"><sheets><sheet name="地区规则核对" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    'xl/_rels/workbook.xml.rels':`<Relationships xmlns="${pkg}/relationships"><Relationship Id="rId1" Type="${docs}/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`,
    'xl/worksheets/sheet1.xml':`<worksheet xmlns="${main}"><cols>${cols}</cols><sheetData>${sheetRows.join('')}</sheetData><autoFilter ref="A1:I${rows.length}"/></worksheet>`
  });
}
function exportRegionRules(){

  if(!rules.length){toast('当前分组和筛选范围内没有可导出的地区规则');return}
  const owner=S.role==='shop'?ME:MYFAC;
  const group=S.role==='shop'?'商家规则':kind==='normal'?'工厂默认规则':'工厂网点规则';
  const rows=[['配置归属','规则名称','地区关系','完整地区','目标动作','启停状态','适用工厂','其他同时满足的条件','组内优先级']];
  function conditionValue(condition){
    if(Array.isArray(condition.v))return (condition.op==='nin'?'不属于 ':'属于 ')+condition.v.join('、');
    return (condition.min===''||condition.min==null?'不限':condition.min)+' 至 '+(condition.max===''||condition.max==null?'不限':condition.max);
  }
  for(const r of rules){
    const region=r.c.region;
    const factory=S.role==='factory'?MYFAC:r.c.factory?conditionValue(r.c.factory):'全部适用工厂';
    const others=Object.entries(r.c).filter(([key])=>key!=='region'&&key!=='factory')
      .map(([key,value])=>condName(key)+' '+conditionValue(value)).join('；');
    const priority=RULES.filter(x=>grpKey(x)===grpKey(r)).findIndex(x=>x.id===r.id)+1;
    for(const path of region.v){
      rows.push([owner+' · '+group,r.name,region.op==='nin'?'不属于':'属于',path,actText(r.a),r.st?'启用':'停用',factory,others||'无',priority]);
    }
  }
  downloadFile(regionWorkbook(rows),owner+'-'+group+'-地区规则核对.xlsx');
  toast('已生成 '+rules.length+' 条地区规则的核对文件，共 '+(rows.length-1)+' 行地区');
}

    shop?{name:'新疆西藏走邮政',path:'西藏自治区',cp:'邮政EMS',state:0}:
      {name:'成都地区走顺丰',path:'四川省/成都市',cp:'顺丰',state:1}
  ];
  const simple=r=>Object.keys(r.c).length===1&&r.c.region?.op==='in'&&r.a.t==='fixed';
  return samples.map(row=>{
    const current=group.find(r=>r.name===row.name);
    const previous=current?.c.region?.v||[];
    const status=row.state??current?.st??0;
    const paths=replace?[row.path]:[...new Set([...previous,row.path])];
    const item={...row,id:current?.id||0,previous,was:current?.st,paths,status,oldCp:current?.a.cp};
    if(current&&(!simple(current)||current.a.cp!==row.cp))
      return {...item,kind:'conflict',result:'同名规则条件或目标快递不同，保留原规则'};
    const collision=group.find(r=>r!==current&&simple(r)&&(r.a.cp!==row.cp||r.st!==status)&&r.c.region.v.some(p=>p===row.path||row.path.startsWith(p+'/')||p.startsWith(row.path+'/')));
    if(collision)return {...item,kind:'conflict',result:`与「${collision.name}」的地区重叠（${collision.a.cp}，${collision.st?'启用':'停用'}），保留原值`};
    if(!current&&group.length>=200)return {...item,kind:'conflict',result:'本组已达 200 条，暂缓新增'};
    if(current&&current.st===status&&JSON.stringify(previous)===JSON.stringify(paths))
      return {...item,kind:'same',result:'与现行规则一致'};
    return {...item,kind:'apply',result:!current?'新增':JSON.stringify(previous)===JSON.stringify(paths)?'仅修改状态':replace?'覆盖地区':'追加地区'};
  });
}

function tailPostalError(v){

function postalIntervals(zip){

  return postalIntervals(zip).some(i=>(!virtual||i.kind!=='exact')&&i.start<=normalized&&normalized<=i.end);

function samePostalTable(a,b){
  if(a.o!==b.o||a.sub!==b.sub)return false;

    if(x.op!=='nin'&&y.op!=='nin'&&!x.v.some(v=>y.v.includes(v)))return false;
    if(x.op==='nin'&&y.op!=='nin'&&y.v.every(v=>x.v.includes(v)))return false;

function conflicts(){
  const w=[];const key=grpKey(E);const all=RULES.filter(r=>grpKey(r)===key);
  if(!E.st)return w;
  const idx=E.id?all.findIndex(r=>r.id===E.id):(E._pos==='top'?0:all.length);
  const above=all.slice(0,idx).filter(r=>r.st&&r.id!==E.id);
  const below=all.slice(E.id?idx+1:idx).filter(r=>r.st);
  const uncond=above.find(r=>!Object.keys(r.c).length&&r.a.t==='none');
  const precedingFallback=above.find(r=>!Object.keys(r.c).length&&r.a.t!=='none');
  if(!uncond&&precedingFallback)w.push(['可能优先采用',`前面的「${precedingFallback.name}」没有条件，可用时会先采用；候选不可用时继续评估本条。`]);
  if(uncond) w.push(['永不命中',`排在前面的「${uncond.name}」没有条件、会命中全部订单，这条规则永远不会执行。请把它拖到「${uncond.name}」之前，或给「${uncond.name}」补充条件。`]);
  if(!Object.keys(E.c).length&&below.length){
    const names=below.map(r=>'「'+r.name+'」').join('、');
    if(E.a.t==='none')w.push(['会挡住下方规则',`此处选择“不分配”会停止匹配。后续 ${below.length} 条启用规则将无法执行：${names}。`]);
    else w.push(['可能优先采用',`本条对全部对象生效，候选可用时优先采用；候选均不可用时继续评估后续 ${below.length} 条启用规则：${names}。`]);
  }
  if(E.c.region&&E.c.region.op==='in'&&Object.keys(E.c).length===1){
    above.concat(below).forEach(r=>{
      if(r.c.region?.op!=='in'||Object.keys(r.c).length!==1)return;
      const overlaps=new Set();
      for(const p of E.c.region.v)for(const q of r.c.region.v){
        if(q===p||p.startsWith(q+'/'))overlaps.add(p);
        else if(q.startsWith(p+'/'))overlaps.add(q);
      }
      if(!overlaps.size)return;
      const first=above.includes(r)?r:E;
      const next=first.a.t==='none'?'命中“不分配”时停止。':'其候选不可用时才继续评估后续规则。';
      w.push(['地区重叠',`与「${r.name}」在 ${[...overlaps].join('、')} 重叠。先评估「${first.name}」，${next}`]);
    });
  }
  if(E.o==='shop'&&E.sc==='domestic'&&E.a.t!=='none'){
    const facs=(E.c.factory&&E.c.factory.v.length)?E.c.factory.v:FACTORIES;const cps=E.a.t==='fixed'?[E.a.cp]:E.a.list;
    const miss=facs.filter(f=>!cps.some(cp=>FACTORY_CP[f].includes(cp)));
    if(miss.length) w.push(['部分工厂不可用',`${miss.join('、')} 未开通「${cps.join(' / ')}」，推送到这些工厂的订单会跳过这条规则、继续往下匹配。`]);

  }
  return w;
}

function orderOutcome(title, rows, scope='') {
  const skipped=rows.filter(r=>r.status==='跳过').length;
  const failed=rows.filter(r=>r.status==='失败').length;
  const changed=rows.filter(r=>r.before!==r.after).length;
  const unmatched=rows.filter(r=>r.status==='仍未匹配').length;
  const pending=rows.filter(r=>r.status==='资料待核').length;
openModal(`<div class="mh">${title}结果<span class="x" onclick="closeModal()">×</span></div><div class="mb">${scope?`<p>${esc(scope)} · 预览 ${rows.length} 单</p>`:''}<p>已处理 ${rows.length-skipped-failed-pending} 单，${['更换工厂','设置工厂'].includes(title)?'工厂变更':title==='取消推送'?'已撤回':'物流变化'} ${changed} 单，仍未匹配 ${unmatched} 单${pending?'，资料待核 '+pending+' 单':''}，跳过 ${skipped} 单，失败 ${failed} 单</p><table><thead><tr><th>订单</th><th>处理前 → 处理后</th><th>结果</th><th>原因</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.no)}</td><td>${esc(r.before||'未匹配')} → ${esc(r.after||'未匹配')}</td><td>${esc(r.status)}</td><td>${esc(r.reason)}</td></tr>`).join('')}</tbody></table></div><div class="mf"><button class="btn p" onclick="closeModal()">完成</button></div>`,'xl');
}
function selectedOrders(useFilter) {
  const rows=visibleOrders().filter(o=>S.olist.includes(o.no));
  return S.sel.size ? rows.filter(o=>S.sel.has(o.no)) : (useFilter?rows.filter(o=>S.olist.includes(o.no)):[]);
}
function batchApply(title,orders,action) {
  const current=new Set(visibleOrders().map(o=>o.no));
  const rows=orders.map(o=>{
    const before=o.cp;
    let status,reason=current.has(o.no)?protectedReason(o):'订单已不在当前操作范围';
    if(reason) status='跳过';
    else [status,reason]=action(o);
    if(current.has(o.no)&&(status==='失败'||status==='跳过'))addEvt(o,`${title} · ${status}：${reason}`);
    return {no:o.no,before,after:o.cp,status,reason};
  });
  S.sel.clear();render();orderOutcome(title,rows);
}
function rematch(){
  const orders=selectedOrders(true);
  if(!orders.length){toast('当前范围没有订单');return}
  const protectedRows=orders.filter(o=>protectedReason(o));
  const editable=orders.filter(o=>!protectedReason(o));
  const locked=editable.filter(o=>o.lock);
  const existing=editable.filter(o=>!o.lock&&o.src!=='none');
  const unmatched=editable.filter(o=>!o.lock&&o.src==='none');
  openModal(`<div class="mh">重新匹配物流<span class="x" onclick="closeModal()">×</span></div><div class="mb">
  <p>范围：${S.sel.size?'已勾选':'当前筛选结果'} ${orders.length} 单。默认处理未匹配 ${unmatched.length} 单。</p>
  <div class="alert a-i">始终跳过 ${protectedRows.length} 单${protectedRows.map(o=>`<div>${esc(o.no)} · ${esc(protectedReason(o))}</div>`).join('')}</div>
  <label class="ck"><input type="checkbox" id="rmOv" ${existing.length?'':'disabled'}>同时重新匹配已有物流的订单（未锁定 ${existing.length} 单）</label>
  <label class="ck mt8"><input type="checkbox" id="rmUl" ${locked.length?'':'disabled'}>同时解除手动或导入锁定并重新匹配（${locked.length} 单）</label></div>
  <div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" id="rmOk">确定</button></div>`);
  const preview=new Map();
  function draw(){
    preview.clear();
    const rows=orders.map(o=>{
      const reason=protectedReason(o)||(o.lock&&!$('#rmUl').checked?'未选择解除手动或导入锁定':'')||
        (!o.lock&&o.src!=='none'&&!$('#rmOv').checked?'未选择覆盖已有物流':'');
      const res=reason?null:runEngine(o,{unlock:$('#rmUl').checked}).res;
      preview.set(o.no,{reason,res,cp:o.cp,src:o.src,fac:o.fac,st:o.st});
      return '<tr><td>'+esc(o.no)+'</td><td>'+esc(o.cp||'未匹配')+'</td><td>'+esc(reason?'跳过 · '+reason:res.incomplete?'资料待核 · '+res.reason:res.cp||'仍未匹配')+'</td></tr>';
    });
    $('#rmRows').innerHTML=rows.join('');
  }
  $('#modal .mb').insertAdjacentHTML('beforeend','<table><thead><tr><th>订单号</th><th>当前快递</th><th>预计结果</th></tr></thead><tbody id="rmRows"></tbody></table>');
  $('#rmOv').onchange=draw;$('#rmUl').onchange=draw;draw();
  $('#rmOk').onclick=()=>{
    const overwrite=$('#rmOv').checked,unlock=$('#rmUl').checked;
    batchApply('重新匹配',orders,o=>{
      const planned=preview.get(o.no);
      if(planned.reason)return ['跳过',planned.reason];
      if(planned.cp!==o.cp||planned.src!==o.src||planned.fac!==o.fac||planned.st!==o.st)return ['跳过','订单已变化，请重新预览'];
      if(o.lock&&!unlock)return ['跳过','未选择解除手动或导入锁定'];
      if(!o.lock&&o.src!=='none'&&!overwrite)return ['跳过','未选择覆盖已有物流'];
      const current=runEngine(o,{unlock}).res;
      if(planned.res.incomplete&&!current.incomplete)return ['跳过','预览时资料不足，请重新预览'];
      if(!current.incomplete&&!sameSelection(planned.res,current))return ['跳过','预计结果已变化，请重新预览'];
      applyEngine(o,{unlock,why:'批量重新匹配'});
      if(o.matchPending)return ['资料待核',o.matchPending+'；保留原物流'];
      return o.src==='none'?['仍未匹配',o.reason]:['已处理',o.rule||SRC[o.src][0]];
    });
  };
}

function partialEditReason(o){

  if(!p.isolated)return '无法隔离商家及工厂子单、工厂条码或审核批次快照，整单跳过';
  if(y.waybill||p.pending)return y.waybill?'Y 已取得运单，保留已有结果':'Y 原申请待回执，保留当前选择';

  const o=visibleOrders().find(x=>x.no===no);if(!o||protectedReason(o))return;const provs=Object.keys(REGION);
  openModal(`<div class="mh">修改收货地址 · ${o.no}<span class="x" onclick="closeModal()">×</span></div><div class="mb">
  <div class="frm"><label>省</label><select class="sel" id="ap" onchange="fillCity()">${provs.map(p=>`<option ${o.prov===p?'selected':''}>${p}</option>`).join('')}</select><label>市</label><select class="sel" id="ac" onchange="fillDist()"></select><label>区县</label><select class="sel" id="ad"></select></div>
  <div class="alert a-i">${o.lock?'该订单物流已锁定（'+SRC[o.src][0]+'），改地址后不会自动重新匹配':'保存后自动按新地址重新匹配物流（未取号、未锁定的订单）'}</div></div>
  <div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" id="adOk">保存</button></div>`);
  window.fillCity=()=>{const p=$('#ap').value;$('#ac').innerHTML=Object.keys(REGION[p]).map(c=>`<option ${o.city===c?'selected':''}>${c}</option>`).join('');fillDist()};
  window.fillDist=()=>{const p=$('#ap').value,c=$('#ac').value;$('#ad').innerHTML=REGION[p][c].map(d=>`<option ${o.dist===d?'selected':''}>${d}</option>`).join('')};
  fillCity();
  $('#adOk').onclick=()=>{
    if(!visibleOrders().includes(o)||protectedReason(o)){closeModal();closeDrawer();render();toast('订单范围或物流状态已变化，未修改地址');return}
    Object.assign(o,{prov:$('#ap').value,city:$('#ac').value,dist:$('#ad').value});o.addr=`${o.prov} ${o.city} ${o.dist}`;
    const before=o.cp;addEvt(o,`收货地址修改为 ${o.addr}`);const done=applyEngine(o,{why:'修改地址后自动重新匹配'});closeModal();render();detail(no);
    toast(o.matchPending?'地址已修改，匹配资料待核：'+o.matchPending:done?`地址已修改，已自动重新匹配：${before||'未匹配'} → ${o.cp||'未匹配'}`:'地址已修改；物流已锁定，未重新匹配');
  };
}
function newRuleFrom(no){
  const o=visibleOrders().find(x=>x.no===no);if(!o||S.role!=='shop')return;closeDrawer();S.page='rules';S.tab='domestic';render();
  editRule(0,{name:`${o.prov}-${o.fac}`,c:{region:{op:'in',v:[o.city?o.prov+'/'+o.city:o.prov]},factory:{op:'in',v:[o.fac]}},a:{t:'fixed',cp:(FACTORY_CP[o.fac]||[]).find(c=>!avail(c,o))||(FACTORY_CP[o.fac]||[])[0]}});
}
/* ============ 拖拽排序 ============ */
function bindDrag(){
  let src=null;
  document.querySelectorAll('tr[draggable="true"]').forEach(tr=>{
    tr.addEventListener('dragstart',e=>{src=tr;e.dataTransfer.effectAllowed='move'});
    tr.addEventListener('dragover',e=>{e.preventDefault();tr.classList.add('drag-over')});
    tr.addEventListener('dragleave',()=>tr.classList.remove('drag-over'));
    tr.addEventListener('drop',e=>{
      e.preventDefault();tr.classList.remove('drag-over');if(!src||src===tr)return;
      if(tr.dataset.id&&src.dataset.id){
        const moved=RULES.find(r=>r.id===Number(src.dataset.id)),target=RULES.find(r=>r.id===Number(tr.dataset.id));
        if(!moved||!target||grpKey(moved)!==grpKey(target))return;
        const key=grpKey(moved),before=RULES.filter(r=>grpKey(r)===key).map(r=>r.id);
        const from=RULES.indexOf(moved),to=RULES.indexOf(target);
        RULES.splice(from,1);RULES.splice(to,0,moved);
        recordRuleMove(moved,before);
      }else if(tr.dataset.fb!==undefined&&src.dataset.fb!==undefined){
        const from=Number(src.dataset.fb),to=Number(tr.dataset.fb);
        updateFallback(tr.dataset.fac,tr.dataset.pf,items=>{
          const [item]=items.splice(from,1);items.splice(to,0,item);
        });
      }
      render();
    });
  });
}
let UNDO=null, undoView='';
function sortView(){return [S.role,S.page,S.role==='shop'?S.tab:S.ftab,S.fdomKind,S.tailSub,S.fbFac].join('|')}
function showUndo(txt,fn){UNDO=fn;undoView=sortView();$('#undoTxt').textContent=txt;$('#undo').classList.add('show');clearTimeout(showUndo._t);showUndo._t=setTimeout(()=>{$('#undo').classList.remove('show');UNDO=null},8000)}
function doUndo(){if(UNDO){const notice=UNDO();UNDO=null;render();toast(notice||'已撤销')}$('#undo').classList.remove('show')}

/* ============ 渲染 ============ */
function render(){
  if(UNDO&&undoView!==sortView()){UNDO=null;$('#undo').classList.remove('show')}
  renderMenu();
  let h='';
  if(S.page==='rules') h=S.role==='shop'?renderRulesShop():renderRulesFactory();
  else h=renderOrders();
  $('#content').innerHTML=h;
  bindDrag();
}
document.querySelectorAll('.role span[data-role]').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.role span[data-role]').forEach(x=>x.classList.remove('on'));el.classList.add('on');

});
function dismissCurrentModal(){
  if(!$('#mask').classList.contains('show'))return;
  if($('#goSave')){drawEdit();return}
  if(document.querySelector('#modal .ed')){cancelEdit();return}
  closeModal();
}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')dismissCurrentModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){dismissCurrentModal();closeDrawer()}});
render();
</script>
