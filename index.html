  ks.forEach(k=>{const x=JSON.stringify(a.c[k]||null),y=JSON.stringify(b.c[k]||null);if(x!==y){
    if(!a.c[k]) out.push(`新增条件「${condName(k)}」`);else if(!b.c[k]) out.push(`移除条件「${condName(k)}」`);

}

  }

    const context={...o,operatorDept:opt.operatorDept || ''};

function recordY2Head(event){
  event.preventDefault();
  if(!y2CanReview()||!y2ReviewPossible()){tailLog('c');return}
  const form = new FormData(event.currentTarget);
  const result = form.get('result'), evidence = String(form.get('evidence')||'').trim();
  const waybill = String(form.get('waybill')||'').trim(), matched = form.has('matched');
  const error = $('#y2reviewError');
  if(!evidence){error.textContent='请填写可回查的外部回执或本次核对记录。';return}
  if(!['pending','accepted','notAccepted','cancelled'].includes(result))return;
  if(y2Head.status==='acceptedPending'&&result==='notAccepted'){error.textContent='此包裹已有受理凭据，请核对原单或原单取消回执。';return}
  if(['notAccepted','cancelled'].includes(result)&&!matched){error.textContent='请先核对该外部结论确实对应本包裹及原请求。';return}
  if(result==='accepted'&&waybill.toUpperCase()==='LM-DEMO-A'){
    error.textContent='该六脉单号已核实属于包裹 A。请核对包裹 C 的原单，当前结果继续保留。';return;
  }
  const prior = y2Head.status;
  if(result==='accepted'){
    y2Head.status = matched&&waybill?'linked':'acceptedPending';
    if(y2Head.status==='linked')y2Head.waybill=waybill;
  }else if(result!=='pending'){
    y2Head.status=result;
  }
  const note = `${y2HeadStates[prior]} → ${y2HeadStates[y2Head.status]}。核对依据 ${evidence}。${result==='accepted'&&y2Head.status==='acceptedPending'?'须继续核对原六脉单号及其归属。':''}${y2Head.waybill?'已补登原六脉单号 '+y2Head.waybill+'。':''}`;
  y2Head.events.push({t:nowStr(),actor:'示例商家甲 · 原授权操作员',note});
  tailLog('c');
}

function planRegionImport(owner,replace){
  const group=RULES.filter(r=>r.o===owner&&r.sc==='domestic'&&(r.kind||'normal')==='normal');
  const shop=owner==='shop';
  const samples=[
    {name:shop?'华北区走中通':'默认：偏远地区走邮政',path:'山西省',cp:shop?'中通':'邮政EMS'},
    {name:'长沙地区走圆通',path:'湖南省/长沙市',cp:'圆通'},
    {name:shop?'北京地区走韵达':'新疆地区走韵达',path:shop?'北京市':'新疆维吾尔自治区',cp:'韵达'},
    shop?{name:'新疆西藏走邮政',path:'西藏自治区',cp:'邮政EMS',state:0}:
      {name:'成都地区走顺丰',path:'四川省/成都市',cp:'顺丰',state:1}
  ];
  const simple=r=>Object.keys(r.c).length===1&&r.c.region?.op==='in'&&r.a.t==='fixed';
  return samples.map(row=>{
    const current=group.find(r=>r.name===row.name);
    const previous=current?.c.region?.v||[];
    const status=row.state??current?.st??0;
    const paths=replace?[row.path]:[...new Set([...previous,row.path])];
    const item={...row,id:current?.id||0,previous,was:current?.st,paths,status,oldCp:current?.a.cp};
    if(current&&(!simple(current)||current.a.cp!==row.cp))
      return {...item,kind:'conflict',result:'同名规则条件或目标快递不同，保留原规则'};
    const collision=group.find(r=>r!==current&&simple(r)&&(r.a.cp!==row.cp||r.st!==status)&&r.c.region.v.some(p=>p===row.path||row.path.startsWith(p+'/')||p.startsWith(row.path+'/')));
    if(collision)return {...item,kind:'conflict',result:`与「${collision.name}」的地区重叠（${collision.a.cp}，${collision.st?'启用':'停用'}），保留原值`};
    if(!current&&group.length>=200)return {...item,kind:'conflict',result:'本组已达 200 条，暂缓新增'};
    if(current&&current.st===status&&JSON.stringify(previous)===JSON.stringify(paths))
      return {...item,kind:'same',result:'与现行规则一致'};
    return {...item,kind:'apply',result:!current?'新增':JSON.stringify(previous)===JSON.stringify(paths)?'仅修改状态':replace?'覆盖地区':'追加地区'};
  });
}

      let target=RULES.find(x=>x.id===r.id);

      return '已应用 · '+r.result;
    });
    render();
    openModal(`<div class="mh">地区规则导入结果<span class="x" onclick="closeModal()">×</span></div><div class="mb"><p>已应用 ${results.filter(x=>x.startsWith('已应用')).length} 行，共 ${plan.length} 行。已有订单保持原物流。</p><table><thead><tr><th>文件行 / 规则</th><th>处理结果</th></tr></thead><tbody>${plan.map((r,i)=>`<tr><td>${i+2} · ${esc(r.name)}</td><td>${esc(results[i])}${r.kind==='conflict'?' · '+esc(r.result):''}</td></tr>`).join('')}</tbody></table></div><div class="mf"><button class="btn" onclick="allLogs()">查看操作记录</button><button class="btn p" onclick="closeModal()">返回规则列表</button></div>`,'xl');
  };

function tailPostal(value={}){
  if(!value.mode)return value;
  return value.mode==='range'?{range:{start:value.a||'',end:value.b||''}}:{[value.mode]:value.a||''};
}
function postalLabels(v){
  const labels=[];
  if('prefix' in v)labels.push(`开头 ${esc(v.prefix)}`);
  if('exact' in v)labels.push(`指定 ${esc(v.exact)}`);
  if(v.range)labels.push(`前三位 ${esc(v.range.start)} ~ ${esc(v.range.end)}`);
  return labels.join('、');
}

function togglePostal(k,on){

function tailPostalError(v){
  if(!Object.keys(v).length)return '请至少勾选一种邮编匹配方式';
  for(const k of ['prefix','exact']){
    if(k in v&&!v[k].split(',').every(x=>x.trim().length>0))return '请补全所勾选的邮编值';
  }
  if(v.range){
    const {start,end}=v.range;
    if(!/^\d{3}$/.test(start)||!/^\d{3}$/.test(end))return '范围起止均须填写三位数字，可带前导零';

}

function conflicts(){
  const w=[];const key=grpKey(E);const all=RULES.filter(r=>grpKey(r)===key);
  if(!E.st)return w;
  const idx=E.id?all.findIndex(r=>r.id===E.id):(E._pos==='top'?0:all.length);
  const above=all.slice(0,idx).filter(r=>r.st&&r.id!==E.id);
  const below=all.slice(E.id?idx+1:idx).filter(r=>r.st);
  const uncond=above.find(r=>!Object.keys(r.c).length&&r.a.t==='none');
  const precedingFallback=above.find(r=>!Object.keys(r.c).length&&r.a.t!=='none');
  if(!uncond&&precedingFallback)w.push(['可能优先采用',`前面的「${precedingFallback.name}」没有条件，可用时会先采用；候选不可用时继续评估本条。`]);
  if(uncond) w.push(['永不命中',`排在前面的「${uncond.name}」没有条件、会命中全部订单，这条规则永远不会执行。请把它拖到「${uncond.name}」之前，或给「${uncond.name}」补充条件。`]);
  if(!Object.keys(E.c).length&&below.length){
    const names=below.map(r=>'「'+r.name+'」').join('、');
    if(E.a.t==='none')w.push(['会挡住下方规则',`此处选择“不分配”会停止匹配。后续 ${below.length} 条启用规则将无法执行：${names}。`]);
    else w.push(['可能优先采用',`本条对全部对象生效，候选可用时优先采用；候选均不可用时继续评估后续 ${below.length} 条启用规则：${names}。`]);
  }
  if(E.c.region&&E.c.region.op==='in'&&Object.keys(E.c).length===1){
    above.concat(below).forEach(r=>{
      if(r.c.region?.op!=='in'||Object.keys(r.c).length!==1)return;
      const overlaps=new Set();
      for(const p of E.c.region.v)for(const q of r.c.region.v){
        if(q===p||p.startsWith(q+'/'))overlaps.add(p);
        else if(q.startsWith(p+'/'))overlaps.add(q);
      }
      if(!overlaps.size)return;
      const first=above.includes(r)?r:E;
      const next=first.a.t==='none'?'命中“不分配”时停止。':'其候选不可用时才继续评估后续规则。';
      w.push(['地区重叠',`与「${r.name}」在 ${[...overlaps].join('、')} 重叠。先评估「${first.name}」，${next}`]);
    });
  }
  if(E.o==='shop'&&E.sc==='domestic'&&E.a.t!=='none'){
    const facs=(E.c.factory&&E.c.factory.v.length)?E.c.factory.v:FACTORIES;const cps=E.a.t==='fixed'?[E.a.cp]:E.a.list;
    const miss=facs.filter(f=>!cps.some(cp=>FACTORY_CP[f].includes(cp)));
    if(miss.length) w.push(['部分工厂不可用',`${miss.join('、')} 未开通「${cps.join(' / ')}」，推送到这些工厂的订单会跳过这条规则、继续往下匹配。`]);

  }
  return w;
}

  ${E._paste?`<div class="mt8"><textarea id="rpaste" class="ipt" style="width:100%;height:80px;padding:6px" placeholder="每行一个地区，省 / 市 / 区用空格或 / 分隔，例如：&#10;广东省 深圳市&#10;浙江省/杭州市/西湖区&#10;新疆维吾尔自治区"></textarea><div class="mt8"><button class="btn s p" onclick="pasteRegion()">识别并添加</button></div></div>`:''}`;

function tgRegionNoDraw(path){const a=E.c.region.v;for(let j=a.length-1;j>=0;j--){if(a[j].startsWith(path+'/'))a.splice(j,1)}if(!a.some(x=>path.startsWith(x+'/')))a.push(path)}

function orderOutcome(title, rows, scope='') {

function selectedOrders(useFilter) {
  const rows=visibleOrders();
  return S.sel.size ? rows.filter(o=>S.sel.has(o.no)) : (useFilter?rows.filter(o=>S.olist.includes(o.no)):[]);
}
function batchApply(title,orders,action) {
  const rows=orders.map(o=>{
    const before=o.cp;
    let status,reason=protectedReason(o);
    if(reason) status='跳过';
    else [status,reason]=action(o);
    if(status==='失败'||status==='跳过')addEvt(o,`${title} · ${status}：${reason}`);
    return {no:o.no,before,after:o.cp,status,reason};
  });
  S.sel.clear();render();orderOutcome(title,rows);
}
function rematch(){

function setCp(){

  const protectedRows=orders.filter(o=>protectedReason(o));
  openModal(`<div class="mh">设置快递<span class="x" onclick="closeModal()">×</span></div><div class="mb"><div class="frm"><label>快递公司</label><select class="sel" id="scp">${CPS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="alert a-w">可用的快递将以手动来源锁定。始终跳过 ${protectedRows.length} 单${protectedRows.map(o=>`<div>${esc(o.no)} · ${esc(protectedReason(o))}</div>`).join('')}</div></div><div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" id="scpOk">确定</button></div>`);

  ${!o.lock&&!taken?`<button class="btn" onclick="applyEngine(ORDERS.find(x=>x.no==='${o.no}'),{why:'手动重新匹配'});render();detail('${o.no}');toast('已重新匹配')">重新匹配</button>`:''}
  ${o.src==='none'&&o.prov&&S.role==='shop'?`<button class="btn p" onclick="newRuleFrom('${o.no}')">为此类订单新建规则</button>`:''}
  ${!taken?`<button class="btn" onclick="editAddr('${o.no}')">修改收货地址</button>`:''}
  ${S.role==='shop'?`<button class="btn" onclick="changeFac('${o.no}')">更换工厂</button>`:''}
  <button class="btn" onclick="closeDrawer();S.page='rules';if(S.role==='shop')S.tab='domestic';else S.ftab='domestic';render();trial(0,'${o.no}')">在规则试算中查看</button></div>
  </div>`);
}
function changeFac(no){
  const o=ORDERS.find(x=>x.no===no);
  openModal(`<div class="mh">更换工厂 · ${o.no}<span class="x" onclick="closeModal()">×</span></div><div class="mb"><div class="frm"><label>当前工厂</label><span>${o.fac}</span><label>新工厂</label><select class="sel" id="nf">${FACTORIES.filter(f=>f!==o.fac).map(f=>`<option>${f}</option>`).join('')}</select></div>
  <div class="alert a-i">${protectedReason(o)?esc(protectedReason(o))+'。更换工厂只变更承接方，保留原物流及请求关联。':o.lock?`当前物流为「${SRC[o.src][0]}」锁定：新工厂可用则保持不变；不可用则自动解除锁定并重新匹配，并写入订单日志`:'换工厂后按新工厂自动重新匹配物流'}</div></div>
  <div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" id="nfOk">确定</button></div>`);
  $('#nfOk').onclick=()=>{
    const nf=$('#nf').value,old=o.fac,oldCp=o.cp;o.fac=nf;addEvt(o,`工厂由 ${old} 更换为 ${nf}`);let msg;
    if(protectedReason(o)){msg=protectedReason(o)+'，换厂后保留原结果与请求关联';addEvt(o,msg)}
    else if(o.lock){const why=avail(o.cp,o);
      if(!why){addEvt(o,`${SRC[o.src][0]}快递 ${o.cp} 在新工厂可用，保持不变`);msg=`${o.cp} 在新工厂可用，保持不变`}
      else{applyEngine(o,{unlock:1,why:`原${SRC[o.src][0]}快递 ${oldCp} 在新工厂不可用（${why}），已解除锁定并重新匹配`});msg=`原快递不可用，已重新匹配为 ${o.cp||'未匹配'}`}}
    else{applyEngine(o,{why:'更换工厂后自动重新匹配'});msg=`已按新工厂重新匹配：${oldCp||'未匹配'} → ${o.cp||'未匹配'}`}
    closeModal();render();detail(no);toast(msg);
  };
}
function editAddr(no){
  const o=ORDERS.find(x=>x.no===no);const provs=Object.keys(REGION);
  openModal(`<div class="mh">修改收货地址 · ${o.no}<span class="x" onclick="closeModal()">×</span></div><div class="mb">
  <div class="frm"><label>省</label><select class="sel" id="ap" onchange="fillCity()">${provs.map(p=>`<option ${o.prov===p?'selected':''}>${p}</option>`).join('')}</select><label>市</label><select class="sel" id="ac" onchange="fillDist()"></select><label>区县</label><select class="sel" id="ad"></select></div>
  <div class="alert a-i">${o.lock?'该订单物流已锁定（'+SRC[o.src][0]+'），改地址后不会自动重新匹配':'保存后自动按新地址重新匹配物流（未取号、未锁定的订单）'}</div></div>
  <div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" id="adOk">保存</button></div>`);
  window.fillCity=()=>{const p=$('#ap').value;$('#ac').innerHTML=Object.keys(REGION[p]).map(c=>`<option ${o.city===c?'selected':''}>${c}</option>`).join('');fillDist()};
  window.fillDist=()=>{const p=$('#ap').value,c=$('#ac').value;$('#ad').innerHTML=REGION[p][c].map(d=>`<option ${o.dist===d?'selected':''}>${d}</option>`).join('')};
  fillCity();
  $('#adOk').onclick=()=>{
    Object.assign(o,{prov:$('#ap').value,city:$('#ac').value,dist:$('#ad').value});o.addr=`${o.prov} ${o.city} ${o.dist}`;
    const before=o.cp;addEvt(o,`收货地址修改为 ${o.addr}`);const done=applyEngine(o,{why:'修改地址后自动重新匹配'});closeModal();render();detail(no);
    toast(done?`地址已修改，已自动重新匹配：${before||'未匹配'} → ${o.cp||'未匹配'}`:'地址已修改；物流已锁定，未重新匹配');
  };
}
function newRuleFrom(no){
  const o=ORDERS.find(x=>x.no===no);closeDrawer();S.page='rules';S.tab='domestic';render();
  editRule(0,{name:`${o.prov}-${o.fac}`,c:{region:{op:'in',v:[o.city?o.prov+'/'+o.city:o.prov]},factory:{op:'in',v:[o.fac]}},a:{t:'fixed',cp:(FACTORY_CP[o.fac]||[]).find(c=>!avail(c,o))||(FACTORY_CP[o.fac]||[])[0]}});
}
/* ============ 拖拽排序 ============ */
function bindDrag(){
  let src=null;
  document.querySelectorAll('tr[draggable="true"]').forEach(tr=>{
    tr.addEventListener('dragstart',e=>{src=tr;e.dataTransfer.effectAllowed='move'});
    tr.addEventListener('dragover',e=>{e.preventDefault();tr.classList.add('drag-over')});
    tr.addEventListener('dragleave',()=>tr.classList.remove('drag-over'));
    tr.addEventListener('drop',e=>{
      e.preventDefault();tr.classList.remove('drag-over');if(!src||src===tr)return;
      if(tr.dataset.id&&src.dataset.id){
        if(grpKey(RULES.find(r=>r.id==src.dataset.id))!==grpKey(RULES.find(r=>r.id==tr.dataset.id)))return;
        const snap=RULES.slice();
        const a=RULES.findIndex(r=>r.id==src.dataset.id),b=RULES.findIndex(r=>r.id==tr.dataset.id);
        const [m]=RULES.splice(a,1);RULES.splice(RULES.findIndex(r=>r.id==tr.dataset.id)+(a<b?1:0),0,m);
        addLog(m,'调整优先级','拖拽调整');showUndo(`「${m.name}」优先级已调整，对之后的订单生效`,()=>{RULES=snap});
      }else if(tr.dataset.fb!==undefined&&src.dataset.fb!==undefined){
        const from=Number(src.dataset.fb),to=Number(tr.dataset.fb);
        updateFallback(tr.dataset.fac,tr.dataset.pf,items=>{
          const [item]=items.splice(from,1);items.splice(to,0,item);
        });
      }
      render();
    });
  });
}
let UNDO=null;
function showUndo(txt,fn){UNDO=fn;$('#undoTxt').textContent=txt;$('#undo').classList.add('show');clearTimeout(showUndo._t);showUndo._t=setTimeout(()=>{$('#undo').classList.remove('show');UNDO=null},8000)}
function doUndo(){if(UNDO){UNDO();UNDO=null;render();toast('已撤销')}$('#undo').classList.remove('show')}
/* ============ 原型说明 ============ */
const NOTES=`<h4>原型说明</h4><ul><li>页面使用本地示例数据，刷新后恢复初始样例。</li><li>右下方切换商家和工厂视角。国内规则可试算，跨境页签展示对应发货台匹配日志。</li><li>商家和工厂各有四种尾程模式。迁移报告按登录租户、模式和账号核对原值及切换结果。</li><li>从订单页勾选多笔样例可检查平台指定、原请求待核、人工锁定、已有运单以及设置快递和重新匹配的逐单反馈。</li></ul>`;
function toggleNote(){const p=$('#notePanel');p.innerHTML=NOTES;p.classList.toggle('show')}

/* ============ 渲染 ============ */
function render(){
  renderMenu();
  let h='';
  if(S.page==='rules') h=S.role==='shop'?renderRulesShop():renderRulesFactory();
  else h=renderOrders();
  $('#content').innerHTML=h;
  bindDrag();
}
document.querySelectorAll('.role span[data-role]').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.role span[data-role]').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  closeDrawer();closeModal();S.oRule='';merchantAllSelected=false;merchantOrderFilter.status='全部';merchantOrderFilter.shop='';merchantOrderFilter.no='';S.role=el.dataset.role;S.sel.clear();$('#undo').classList.remove('show');UNDO=null;S.kw='';S.stF='all';S.oq='all';S.osrc='';render();
});
function dismissCurrentModal(){
  if(!$('#mask').classList.contains('show'))return;
  if($('#goSave')){drawEdit();return}
  if(document.querySelector('#modal .ed')){cancelEdit();return}
  closeModal();
}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')dismissCurrentModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){dismissCurrentModal();closeDrawer()}});
render();
</script>
